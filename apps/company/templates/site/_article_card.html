{% load site_tags %}<div class="card"><a class="stretch" href="{% purl 'article' a.slug %}"><div class="pimg">{% if a.cover %}<img src="{{ a.cover|media }}" alt="" loading="lazy" width="320" height="240">{% else %}{% motif a %}{% endif %}</div><div class="in"><h3>{% t a "title" %}</h3><p>{% t a "excerpt" %}</p><span class="meta">{{ a.published_at|date:"j N Y" }}{% if a.author %} · {{ a.author }}{% endif %}</span>{% if a.status != "published" %} <span class="pill">draft</span>{% endif %}<span class="more">{% ui "read_more" %} ›</span></div></a></div>
