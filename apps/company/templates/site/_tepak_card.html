<div class="in"><span class="ser">{{ p.variant }}</span><h3>{{ p.name }}</h3><p>{% t p "summary" %}</p>{% if p.spec %}<div class="specs"><span>{{ p.spec }}</span></div>{% endif %}<span class="more">{% ui "see_product" %} ›</span></div></a></div>
