{% load static %}<style>
.kopx{display:flex;align-items:center;gap:14px;padding:8px 14px 0}.kopx .lg{width:84px;height:auto;flex:none}.kopx .t{flex:1;text-align:center}
.kopx .nm{font:700 22px/1.15 Georgia,"Times New Roman",serif;color:#173d8f;letter-spacing:.3px}.kopx .tg{font:700 11px/1.3 Arial,Helvetica,sans-serif;color:#173d8f;margin-top:2px;letter-spacing:.4px}.kopx .ad{font:700 10.5px/1.35 Georgia,"Times New Roman",serif;color:#000;margin-top:3px}
.kopx-rule{margin:8px 0 10px;border-top:3px solid #173d8f;height:0}.kopx-rule:after{content:"";display:block;margin-top:2px;border-top:1px solid #173d8f}
.kopx,.kopx-rule{-webkit-print-color-adjust:exact;print-color-adjust:exact}{% if print_only %}.kopwrap{display:none}@media print{.kopwrap{display:block;margin-bottom:6px}}{% endif %}
</style><div class="kopwrap"><div class="kopx">{% if kind == "poli" %}<svg class="lg" viewBox="0 0 100 100" role="img" aria-label="Poliklinik"><circle cx="50" cy="50" r="48" fill="#0f2f75"/><circle cx="50" cy="50" r="42" fill="#fff"/><circle cx="50" cy="50" r="38" fill="#2171e0"/><path fill="#fff" d="M42 20h16v22h22v16H58v22H42V58H20V42h22z"/><rect x="11" y="42" width="78" height="16" fill="#fff" stroke="#0f2f75" stroke-width="1.4"/><text x="50" y="54" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="11" fill="#0f2f75">POLIKLINIK</text></svg>{% else %}<img class="lg" src="{% static 'core/kop-logo.png' %}" alt="Logo perusahaan">{% endif %}<div class="t"><div class="nm">{{ name }}</div>{% if line2 %}<div class="tg">{{ line2 }}</div>{% endif %}{% if addr %}<div class="ad">{{ addr }}</div>{% endif %}</div></div><div class="kopx-rule"></div></div>
