<div class="adj-row {% if r.kind == 'potongan' %}is-minus{% else %}is-plus{% endif %}" data-row>
<div class="adj-c adj-c-kind"><span class="adj-lb">Jenis</span><input type="hidden" name="kind" value="{{ r.kind }}"><div class="adj-seg" role="group" aria-label="Jenis"><button type="button" class="adj-p" data-k="tambah" aria-pressed="{% if r.kind != 'potongan' %}true{% else %}false{% endif %}" title="Menambah gaji">+ Tambahan</button><button type="button" class="adj-m" data-k="potongan" aria-pressed="{% if r.kind == 'potongan' %}true{% else %}false{% endif %}" title="Mengurangi gaji">− Potongan</button></div></div>
<div class="adj-c adj-c-comp"><label class="adj-lb">Komponen</label><select name="component"><option value="" data-kind="">Pilih komponen…</option>{% for k, lbl, items in groups %}{% for pk, name, signed in items %}<option value="{{ pk }}" data-kind="{{ k }}"{% if r.component == pk|stringformat:"s" %} selected{% endif %}>{{ name }}</option>{% endfor %}{% endfor %}</select>{% for e in r.errors.component %}<p class="adj-err">{{ e }}</p>{% endfor %}</div>
<div class="adj-c adj-c-amt"><label class="adj-lb">Nominal (Rp)</label><div class="adj-amt"><span class="adj-sg">{% if r.kind == 'potongan' %}−{% else %}+{% endif %}</span><input name="amount" value="{{ r.amount }}" inputmode="numeric" autocomplete="off" data-rupiah="1" placeholder="150.000"></div>{% for e in r.errors.amount %}<p class="adj-err">{{ e }}</p>{% endfor %}</div>
<div class="adj-c adj-c-note"><label class="adj-lb">Keterangan (opsional)</label><input name="note" value="{{ r.note }}" maxlength="300" placeholder="mis. target Oktober">{% for e in r.errors.note %}<p class="adj-err">{{ e }}</p>{% endfor %}{% for e in r.errors.kind %}<p class="adj-err">{{ e }}</p>{% endfor %}</div>
<div class="adj-c adj-c-del"><button type="button" class="adj-del" data-del title="Hapus baris" aria-label="Hapus baris">✕</button></div>
</div>
