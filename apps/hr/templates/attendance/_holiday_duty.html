<div class="hl-duty" data-hlduty>
<div class="fld"><label for="duty-{{ h.pk|default:'new' }}">Apakah perusahaan tetap beroperasi?</label>
<select id="duty-{{ h.pk|default:'new' }}" name="duty" data-duty>{% for k, v in duty_choices %}<option value="{{ k }}"{% if h.duty == k %} selected{% endif %}>{{ v }}</option>{% endfor %}</select>
<div class="help">Pilih <b>Tidak ada</b> bila semua libur. Pilih lainnya bila ada karyawan yang tetap harus masuk.</div></div>
<div class="fld hl-dept" data-dept hidden><label>Departemen yang wajib masuk</label>
<div class="roster">{% for d in departments %}<label><input type="checkbox" name="duty_departments" value="{{ d.pk }}"{% if d.pk in h.duty_ids %} checked{% endif %}> {{ d.name }}</label>{% endfor %}</div></div>
<div class="fld hl-prem" data-prem hidden><label class="chk"><input type="checkbox" name="duty_premium" value="1"{% if not h or h.duty_premium %} checked{% endif %}> Yang masuk dihitung <b>Hari Libur</b> di Payroll</label>
<div class="help">Hilangkan centang bila hari itu ditetapkan sebagai hari kerja biasa.</div></div>
</div>
