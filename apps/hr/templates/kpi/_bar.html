<form method="get" data-fbar class="bar"><input type="month" name="month" value="{{ month }}" aria-label="Bulan">{% if not is_admin %}<select name="dept" aria-label="Departemen"><option value="">Semua departemen</option>{% for d in depts %}<option value="{{ d.pk }}"{% if dept == d.pk|stringformat:"s" %} selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>{% endif %}{% if extra %}{{ extra }}{% endif %}</form>
