#!/usr/sbin/nft -f
# /etc/nftables.conf: HOST PUBLIK. Default DROP. Ganti ADMIN_IP dengan IP kantor/VPN Anda.
define ADMIN_IP = 203.0.113.10
flush ruleset
table inet filter {
  set blocked { type ipv4_addr; flags dynamic,timeout; timeout 10m; }
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    ip saddr @blocked drop
    ip protocol icmp icmp type echo-request limit rate 5/second accept
    # SSH hanya dari IP admin (HRIS menarik lamaran lewat SSH dari IP publik kantor: tambahkan di sini juga)
    tcp dport 22 ip saddr $ADMIN_IP accept
    # 80/443: batasi koneksi SERENTAK & laju koneksi BARU per IP; pelanggar diblokir 10 menit
    tcp dport { 80, 443 } ct state new meter flood { ip saddr limit rate over 60/second burst 120 packets } add @blocked { ip saddr } drop
    tcp dport { 80, 443 } ct count over 100 drop
    tcp dport { 80, 443 } accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
