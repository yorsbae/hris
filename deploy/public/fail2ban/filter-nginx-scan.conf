# /etc/fail2ban/filter.d/nginx-scan.conf, pemindai kerentanan: .php, wp-*, .env, .git, shell, phpmyadmin (situs ini TIDAK punya PHP; semua itu pasti bot)
[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD) [^"]*(\.php|wp-login|wp-admin|xmlrpc|\.env|\.git/|phpmyadmin|cgi-bin|/shell|webshell|eval-stdin|\.aspx?)[^"]*" (403|404|444)
            ^<HOST> .* "[^"]*" 400 
ignoreregex =
