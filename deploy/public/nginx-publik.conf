# /etc/nginx/conf.d/wadimor.conf: HOST PUBLIK (internet). Dipakai di belakang Cloudflare (disarankan) ATAU langsung.
# Lapisan: Cloudflare (DDoS L3/L4/L7, WAF, cache) -> nftables (laju koneksi) -> Nginx (laju request, cache, blokir pemindai) -> gunicorn (sandbox) -> DB lokal.
# Angka = usulan awal; setel setelah melihat lalu lintas nyata.

# ---------- IP asli pengunjung (hanya bila di belakang Cloudflare; daftar IP: https://www.cloudflare.com/ips/ ; perbarui berkala) ----------
# include /etc/nginx/cloudflare-realip.conf;     # berisi: set_real_ip_from <CIDR>; ... real_ip_header CF-Connecting-IP;
# Tanpa Cloudflare: biarkan baris di atas dikomentari dan HAPUS TRUSTED_PROXY_IPS selain 127.0.0.1 di .env.

# ---------- Zona batas ----------
limit_req_zone  $binary_remote_addr zone=pub_all:20m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=pub_apply:10m rate=6r/m;    # kirim lamaran
limit_req_zone  $binary_remote_addr zone=pub_form:10m  rate=10r/m;   # kontak, lacak status, pencarian
limit_conn_zone $binary_remote_addr zone=pub_conn:20m;
limit_req_status 429; limit_conn_status 429;
proxy_cache_path /var/cache/nginx/wadimor levels=1:2 keys_zone=wadimor:50m max_size=500m inactive=10m use_temp_path=off;

# Penolak pemindai: user-agent alat serang/pemindai umum
map $http_user_agent $bad_ua { default 0; ~*(sqlmap|nikto|nmap|masscan|zgrab|acunetix|wpscan|dirbuster|gobuster|havij|python-requests/2\.[0-9]+\.[0-9]+$|libwww-perl) 1; "" 1; }

# Slowloris & kiriman lambat
client_header_timeout 10s; client_body_timeout 15s; send_timeout 15s; keepalive_timeout 15s; reset_timedout_connection on;
client_header_buffer_size 2k; large_client_header_buffers 4 8k;

server { listen 80 default_server; server_name _; return 444; }                      # akses via IP/host asing: putus tanpa jawaban
server { listen 80; server_name wadimor.co.id www.wadimor.co.id; return 301 https://wadimor.co.id$request_uri; }
server { listen 443 ssl default_server; server_name _; ssl_certificate /etc/ssl/wadimor/fullchain.pem; ssl_certificate_key /etc/ssl/wadimor/privkey.pem; return 444; }

server {
    listen 443 ssl;
    http2 on;
    server_name wadimor.co.id;
    ssl_certificate     /etc/ssl/wadimor/fullchain.pem;
    ssl_certificate_key /etc/ssl/wadimor/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m; ssl_session_timeout 1d; ssl_session_tickets off;
    ssl_stapling on; ssl_stapling_verify on;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=300" always;                      # naikkan bertahap: 300 -> 86400 -> 31536000 (+ includeSubDomains setelah stabil)
    add_header X-Content-Type-Options "nosniff" always;
    # CSP & header lain dikirim Django (apps/company/public_views.py); JANGAN menimpanya di sini.

    client_max_body_size 4m;                                                         # CV maks 3 MB + overhead form
    limit_conn pub_conn 30;
    if ($bad_ua) { return 444; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    # ---- Blokir permintaan yang PASTI jahat: situs ini tidak punya PHP/ASP/CGI/dotfile/admin. Satu-satunya 'shell' yang mungkin = unggahan; jadi unggahan tidak pernah dieksekusi (lihat bawah).
    location ~* \.(php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|pl|py|sh|bash|exe|dll|ini|bak|sql|swp|old|orig|log)$ { return 444; }
    location ~ /\.(?!well-known) { return 444; }
    location ~* ^/(wp-|wordpress|xmlrpc|phpmyadmin|pma|cgi-bin|vendor|node_modules|admin|login|manager|actuator|solr|\.git) { return 444; }

    # ---- Statis (kode situs): disajikan Nginx langsung, cache panjang
    location /static/ { alias /srv/wadimor/app/static_root/; expires 30d; add_header Cache-Control "public, immutable"; access_log off; }

    # ---- Media = gambar situs saja (company/<jenis>/<32hex>.jpg|png|webp). Folder ini mount noexec; hanya ekstensi gambar yang dilayani; CV TIDAK pernah di sini.
    location ~ ^/media/company/[a-z0-9_]+/[0-9a-f]{32}\.(jpg|jpeg|png|webp)$ {
        root /srv/wadimor;
        expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always; try_files $uri =404; access_log off;
    }
    location /media/ { return 404; }
    location = /healthz { access_log off; allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8100; include /etc/nginx/pub_proxy.conf; }

    # ---- Formulir: batas laju ketat, TIDAK di-cache
    location ~ ^(/en)?/karir/[^/]+/lamar/$ { limit_req zone=pub_apply burst=3 nodelay; client_max_body_size 4m; proxy_pass http://127.0.0.1:8100; include /etc/nginx/pub_proxy.conf; }
    location ~ ^(/en)?/(kontak|karir/status|karir/lupa-tautan|cari)/ { limit_req zone=pub_form burst=5 nodelay; client_max_body_size 64k; proxy_pass http://127.0.0.1:8100; include /etc/nginx/pub_proxy.conf; }

    # ---- Halaman publik (GET): micro-cache 60 dtk + stale saat backend lambat/mati -> lonjakan trafik & serangan beban tidak sampai ke Django
    location / {
        limit_req zone=pub_all burst=40 nodelay;
        client_max_body_size 64k;
        proxy_cache wadimor; proxy_cache_methods GET HEAD; proxy_cache_valid 200 60s; proxy_cache_valid 404 10s;
        proxy_cache_lock on; proxy_cache_lock_timeout 5s; proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504; proxy_cache_background_update on;
        proxy_cache_bypass $http_authorization $cookie_csrftoken; proxy_no_cache $http_authorization $cookie_csrftoken;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://127.0.0.1:8100; include /etc/nginx/pub_proxy.conf;
    }
}
