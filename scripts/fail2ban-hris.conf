# fail2ban untuk HRIS (putaran 21, P1). Pasang:
#   /etc/fail2ban/filter.d/hris.conf   ← bagian [Definition] di bawah
#   /etc/fail2ban/jail.d/hris.local    ← bagian [hris] di bawah
# Aplikasi menulis satu baris `login_failed ip=<IP klien asli>` ke app.log pada setiap login gagal (logger hris.security; IP sudah memperhitungkan
# TRUSTED_PROXY_IPS). Kunci akun per username di aplikasi melindungi akun; fail2ban memblokir SUMBER (IP) di firewall.

# ---- /etc/fail2ban/filter.d/hris.conf
[Definition]
failregex = ^\S+ \S+ hris\.security WARNING login_failed ip=<HOST>$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S

# ---- /etc/fail2ban/jail.d/hris.local
[hris]
enabled  = true
port     = http,https
filter   = hris
logpath  = /opt/hris/app.log        # sesuaikan dengan BASE_DIR/app.log
maxretry = 10
findtime = 10m
bantime  = 1h
